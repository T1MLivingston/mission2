<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAFIA: Shadows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080b1c; --night:#121836; --panel:#161c40; --line:#2c3470;
  --plum:#3b2670; --blood:#dc3d54; --gold:#e9b949; --bone:#eee8db; --mist:#a3a9cc;
  --sky-a:#0b1030; --sky-b:#2a1d5c; --orb:#f3ecd0; --orb-glow:rgba(243,236,208,.35);
  --display:"Limelight","Rockwell","Georgia",serif;
  --body:"Atkinson Hyperlegible","Verdana","Segoe UI",sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#080b1c; } }
:root[data-theme="dark"]{ --ink:#080b1c; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--ink);color:var(--bone);font-family:var(--body);font-size:17px;line-height:1.5}
body[data-phase="day"]{--sky-a:#3a3f9a;--sky-b:#c98a4b;--orb:#ffd978;--orb-glow:rgba(255,217,120,.45)}
body[data-phase="dawn"]{--sky-a:#2a1d5c;--sky-b:#d98a5a;--orb:#ffd978;--orb-glow:rgba(255,217,120,.4)}
body[data-phase="vote"],body[data-phase="verdict"]{--sky-a:#2a1040;--sky-b:#a52a44;--orb:#ffb38a;--orb-glow:rgba(255,150,120,.4)}
body[data-phase="end"]{--sky-a:#1a1440;--sky-b:#8a6a1e;--orb:#ffe9a8;--orb-glow:rgba(255,233,168,.45)}

button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;margin:0}
p{margin:0 0 .7em}

/* The sky is the clock: the moon or sun crosses it as the phase runs out */
#sky{position:relative;height:190px;overflow:hidden;background:linear-gradient(180deg,var(--sky-a),var(--sky-b));transition:background 1.2s}
#sky .stars{position:absolute;inset:0;opacity:.8;background-image:
  radial-gradient(1.5px 1.5px at 8% 22%,#fff,transparent),radial-gradient(1px 1px at 19% 48%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 31% 15%,#fff,transparent),radial-gradient(1px 1px at 44% 38%,#fff,transparent),
  radial-gradient(1px 1px at 57% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 66% 44%,#fff,transparent),
  radial-gradient(1px 1px at 78% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 36%,#fff,transparent),
  radial-gradient(1px 1px at 96% 10%,#fff,transparent)}
body[data-phase="day"] #sky .stars,body[data-phase="dawn"] #sky .stars{opacity:.15}
#orb{position:absolute;width:46px;height:46px;border-radius:50%;background:var(--orb);box-shadow:0 0 40px 14px var(--orb-glow);left:8%;bottom:55%;transform:translate(-50%,50%);transition:left .6s linear,bottom .6s linear,background 1s}
#sky svg{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:70px;display:block}
#sky svg .roofs{fill:var(--ink)}
#sky svg .win{fill:var(--gold);opacity:.85}
.skytext{position:absolute;left:0;right:0;top:22px;text-align:center;padding:0 16px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.skytext h1{font-size:clamp(1.9rem,6vw,3rem);letter-spacing:.02em}
.skytext p{margin:.3em 0 0;color:var(--bone);opacity:.9}
#clock{position:absolute;right:14px;bottom:10px;font-family:var(--display);font-size:1.5rem;color:var(--gold);text-shadow:0 2px 8px #000}

#wrap{max-width:1040px;margin:0 auto;padding:18px 14px 40px;display:grid;gap:18px}
@media(min-width:880px){#wrap.withchat{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel + .panel{margin-top:14px}
#stage{display:grid;gap:14px;min-width:0}
#stage > .panel{margin-top:0}
#wrap > *{min-width:0}
.tv,.tv-screen,.tv-lower{min-width:0;max-width:100%}
.panel h2{font-size:1.45rem;margin-bottom:.4em}
.panel h3{font-family:var(--body);font-weight:700;font-size:1rem;margin:0 0 .5em}
.muted{color:var(--mist)}
.small{font-size:.9rem}

.btn{border:1px solid var(--line);background:var(--night);border-radius:10px;padding:.6em 1em;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--mist)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1404;font-weight:700}
.btn.red{background:var(--blood);border-color:var(--blood);color:#fff;font-weight:700}
.btn.quiet{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:grid;gap:6px;margin-bottom:14px}
.field input,.field select,.chatin input{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.6em .8em;min-height:44px;width:100%}
#codeIn{font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;font-size:1.3rem}

.homegrid{display:grid;gap:14px}
@media(min-width:700px){.homegrid{grid-template-columns:1fr 1fr}}

.code{font-family:var(--display);font-size:clamp(2.6rem,12vw,4.4rem);letter-spacing:.22em;color:var(--gold);line-height:1}

ul.people{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.people li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--night);border:1px solid transparent}
ul.people li.out{opacity:.55}
ul.people li.out .nm{text-decoration:line-through}
ul.people .nm{font-weight:700;overflow-wrap:anywhere}
ul.people .tag{margin-left:auto;font-size:.85rem;color:var(--mist);text-align:right}
ul.people .tag.ok{color:var(--gold)}

/* Faction marks use shape as well as color */
.mk{display:inline-block;width:14px;height:14px;flex:none}
.mk.town{border-radius:50%;background:var(--gold)}
.mk.mafia{background:var(--blood);transform:rotate(45deg)}
.mk.neutral{background:#b693ff;clip-path:polygon(50% 0,100% 100%,0 100%)}
.mk.none{border:2px solid var(--line);border-radius:50%}

.picks{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pick{border:2px solid var(--line);background:var(--night);border-radius:999px;padding:.5em 1.1em;cursor:pointer;min-height:44px}
.pick:hover{border-color:var(--mist)}
.pick[aria-pressed="true"]{border-color:var(--gold);background:#3a2f10;color:var(--gold);font-weight:700}
.pick.skip{border-style:dashed}

.rolecard{text-align:center;border:1px solid var(--gold);background:linear-gradient(180deg,#1d2350,#151a3c);animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.rolecard .rname{font-family:var(--display);font-size:clamp(2.4rem,10vw,4rem);color:var(--gold);margin:.1em 0}
.rolecard.mafia{border-color:var(--blood)} .rolecard.mafia .rname{color:var(--blood)}
.rolecard.neutral{border-color:#b693ff} .rolecard.neutral .rname{color:#c9afff}
.rolecard dl{text-align:left;max-width:520px;margin:16px auto 0;display:grid;gap:10px}
.rolecard dt{font-weight:700;color:var(--mist);font-size:.9rem}
.rolecard dd{margin:0}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}

details.myrole{border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
details.myrole summary{cursor:pointer;font-weight:700}
details.myrole p{margin:.5em 0 0}

.scene{border-left:4px solid var(--gold);padding:4px 0 4px 16px}
.scene .place{font-family:var(--display);font-size:1.3rem;color:var(--gold)}
.scene p{font-size:1.1rem;margin:.4em 0}
.notes{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--night)}
.notes ul{margin:0;padding-left:1.1em}

.big{font-family:var(--display);font-size:clamp(1.8rem,7vw,3rem);text-align:center;padding:30px 10px}
.alert{border:1px solid var(--blood);border-radius:12px;padding:12px 14px;background:#2a1020}

ol.timeline{margin:0;padding-left:1.4em;display:grid;gap:6px}

#chat{display:flex;flex-direction:column;height:min(70vh,560px);padding:0;overflow:hidden}
#chat .tabs{display:flex;border-bottom:1px solid var(--line)}
#chat .tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 6px;cursor:pointer;min-height:44px}
#chat .tabs button[aria-selected="true"]{border-bottom-color:var(--gold);color:var(--gold);font-weight:700}
#msgs{flex:1;overflow-y:auto;padding:12px 14px;display:grid;gap:8px;align-content:start}
#msgs .m{overflow-wrap:anywhere}
#msgs .m b{color:var(--gold);margin-right:6px}
#msgs .m.me b{color:var(--bone)}
.chatin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chatin input{flex:1;min-width:0}

/* Mafia counter in the sky */
#mafiaChip{position:absolute;left:14px;bottom:10px;display:flex;align-items:center;gap:10px;background:rgba(8,11,28,.82);border:2px solid var(--blood);border-radius:12px;padding:6px 12px 6px 10px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
#mafiaChip .num{font-family:var(--display);font-size:2rem;line-height:1;color:var(--blood)}
#mafiaChip .lbl{font-weight:700;line-height:1.15;font-size:.9rem}
#mafiaChip .lbl span{display:block;font-weight:400;color:var(--mist);font-size:.8rem}
.dia{display:flex;gap:5px;flex-wrap:wrap;max-width:110px}
.dia i{width:12px;height:12px;background:var(--blood);transform:rotate(45deg);display:block}
.dia i.gone{background:transparent;border:2px solid #6b5a72}
#mafiaChip.bump{animation:bump .9s ease}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.18)}100%{transform:scale(1)}}

/* The news TV */
.tv{background:linear-gradient(180deg,#3a2a4f,#24193a);border-radius:22px;padding:14px 14px 18px;border:1px solid #5b4580;box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.45);position:relative}
.tv::after{content:"";position:absolute;left:50%;bottom:6px;width:60px;height:5px;border-radius:3px;background:#5b4580;transform:translateX(-50%)}
.tv-screen{background:radial-gradient(ellipse at 50% 40%,#1d2a5a,#0a0f26 80%);border-radius:14px;overflow:hidden;position:relative;border:3px solid #0b0816}
.tv-screen::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);z-index:2}
.tv-top{display:flex;align-items:center;gap:10px;padding:10px 14px 0}
.tv-live{background:var(--blood);color:#fff;font-weight:700;font-size:.8rem;padding:2px 8px;border-radius:4px;letter-spacing:.06em}
.tv-chan{font-family:var(--display);color:var(--gold);font-size:1.05rem}
.tv-body{padding:10px 18px 14px}
.tv-anchor{color:var(--mist);font-size:.9rem;margin:0 0 .3em}
.tv-head{font-family:var(--display);font-size:clamp(1.5rem,5.5vw,2.3rem);color:#fff;margin:0 0 .35em;line-height:1.1}
.tv-body p.line{font-size:1.08rem;margin:.35em 0}
.tv-body p.line.strong{font-weight:700;color:var(--gold)}
.tv-lower{display:flex;align-items:stretch;border-top:2px solid var(--gold);background:#0b0816}
.tv-count{background:var(--blood);color:#fff;font-weight:700;padding:8px 12px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tv-count b{font-family:var(--display);font-size:1.35rem;font-weight:400}
.ticker{overflow:hidden;flex:1;display:flex;align-items:center;min-width:0}
.ticker span{display:inline-block;white-space:nowrap;padding-left:100%;animation:tick 38s linear infinite;color:var(--bone)}
@keyframes tick{to{transform:translateX(-100%)}}
.tv.compact .tv-head{font-size:clamp(1.25rem,4.5vw,1.7rem)}

/* Role setup */
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.setup{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.setup li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--night)}
.setup .rn{font-weight:700}
.setup .rd{display:block;color:var(--mist);font-size:.85rem;font-weight:400}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--ink);cursor:pointer;font-size:1.3rem;line-height:1}
.step button[disabled]{opacity:.35;cursor:not-allowed}
.step output{min-width:2ch;text-align:center;font-family:var(--display);font-size:1.4rem}
.setup li.cit{background:transparent;border:1px dashed var(--line)}
.sum{margin:12px 0 0;font-weight:700}

/* Room code and QR */
.joinbox{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.qr{background:#fff;border-radius:12px;padding:8px;width:150px;height:150px;flex:none}
.qr svg{display:block;width:100%;height:100%}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--blood);color:#fff;padding:10px 16px;border-radius:10px;max-width:92vw;z-index:9}
[hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important} .ticker span{padding-left:0;white-space:normal} }
@media (max-width:520px){ #sky{height:210px} #mafiaChip .num{font-size:1.6rem} .qr{width:130px;height:130px} }
</style>
</head>
<body data-phase="home">

  <div id="orb"></div>

  <div id="clock" aria-live="off"></div>
</header>

<div id="wrap">
  <main id="main">
    <section id="home"></section>
    <section id="stage" hidden></section>
  </main>
  <aside id="chat" class="panel" hidden aria-label="Chat"></aside>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){

const newId = n => { let s=''; const c='abcdefghijklmnopqrstuvwxyz0123456789'; for(let i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; };
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ---------- Game data ---------- */
const MIN = 4, MAX = 15;
const ROLES = {
  citizen:{name:'Citizen',team:'town',tag:'No powers. Just your wits and a loud opinion.',ability:'None. Talk, listen, and vote.',goal:'Vote out every member of the Mafia.'},

/* {n} is a player's name, {p} is a place in town */
const S_KILL = [
  '{n} heard a strange noise near {p} and went to check on it. Classic mistake. A shadow in a very nice hat was waiting.',
  '{n} was found at {p} wrapped in forty feet of party streamers, too spooked to speak.',
  'Someone slipped {n} a note that said "boo." It worked far too well. {n} has left town in a hurry.',
  'The lights flickered at {p}. A door creaked. When the dust settled, {n} was gone and only a single sock remained.',
  '{n} answered a knock at midnight. Nobody was there. Just a rubber chicken and a ticket out of town.',
  'Witnesses say {n} was last seen at {p}, arguing with a man in a trench coat about pizza toppings. {n} lost.',
  '{n} opened the fridge for a midnight snack and found the Mafia inside. Nobody knows how they all fit.',

  'The town woke to find {n}\'s bed full of jelly beans and {n} nowhere to be found.',

  'A pigeon delivered a tiny letter to {n} reading "pack your bags." {n} took the hint and caught the last bus.',

  '{n} got a phone call at 3 a.m. The voice just said "the cannoli is ready." {n} has not been seen since.',
  'The Mafia challenged {n} to a staring contest at {p}. {n} blinked first. Rules are rules.'
];
const S_SAVE = [
  'A shadow crept up on a sleeping neighbor. Then the Doctor burst in wearing bunny slippers and swinging a first aid kit.',

  'The Mafia tiptoed into {p} and tripped over a pile of bandages. Somebody had been expecting them.',

const fill = (t, n, p) => t.split('{n}').join(n || '').split('{p}').join(p || 'town');
const pickBy = (arr, seed) => { let h = 0; const s = String(seed); for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0; return arr[h % arr.length]; };

/* Roles a host can count in a custom setup, with limits */
const SETUP = [
  {k:'mafia', max:7}, {k:'godfather', max:1}, {k:'detective', max:3},
  {k:'doctor', max:3}, {k:'sheriff', max:3}, {k:'jester', max:2}
];
const defaultCounts = () => ({mafia:1, godfather:0, detective:1, doctor:1, sheriff:0, jester:0});
function suggestCounts(n){
  const c = {mafia:1, godfather:0, detective:1, doctor:1, sheriff:0, jester:0};
  const m = n<=6 ? 1 : n<=9 ? 2 : n<=12 ? 3 : 4;
  if (m >= 2){ c.godfather = 1; c.mafia = m - 1; }
  if (n >= 8) c.sheriff = 1;
  if (n >= 9) c.jester = 1;
  return c;
}
function setupProblem(n, c){
  c = c || {};
  const maf = (c.mafia||0) + (c.godfather||0);
  const total = SETUP.reduce((a,x) => a + (c[x.k]||0), 0);
  if (maf < 1) return 'Add at least 1 Mafia or a Godfather.';
  if (maf * 2 >= n) return `${maf} Mafia is too many for ${n} players. Keep the Mafia under half the town.`;
  if (total > n) return `That's ${total} roles for ${n} players. Remove some roles or add players.`;
  return '';
}
function buildRoles(n, st){
  st = st || {};
  if (st.mode === 'custom' && !setupProblem(n, st.counts)){
    const roles = [];
    SETUP.forEach(x => { for (let i=0;i<(st.counts[x.k]||0);i++) roles.push(x.k); });
    while (roles.length < n) roles.push('citizen');
    return shuffle(roles);
  }
  let m = n<=6 ? 1 : n<=9 ? 2 : n<=12 ? 3 : 4;
  const roles = [];
  if (m >= 3 || (m === 2 && Math.random() < 0.7)){ roles.push('godfather'); m--; }
  for (let i=0;i<m;i++) roles.push('mafia');
  let power;
  if (n === 4) power = [rnd(['detective','doctor'])];
  else if (n === 5) power = rnd([['detective'],['detective','doctor'],['doctor','sheriff']]);
  else if (n <= 7) power = rnd([['detective','doctor'],['sheriff','doctor'],['detective','doctor']]);
  else { power = ['detective','doctor']; if (n >= 10 || Math.random() < 0.5) power.push('sheriff'); }
  roles.push(...power);
  const jChance = n >= 9 ? 0.7 : n >= 7 ? 0.5 : 0;
  if (Math.random() < jChance) roles.push('jester');
  while (roles.length < n) roles.push('citizen');
  return shuffle(roles.slice(0,n));
}
const ORDER = ['godfather','mafia','detective','doctor','sheriff','jester','citizen'];
function countRoles(list){ const c = {}; list.forEach(k => { c[k] = (c[k]||0)+1; }); return c; }
function setupText(c){
  return ORDER.filter(k => c[k]).map(k => c[k] + ' ' + (c[k] > 1 ? plural(k) : ROLES[k].name)).join(', ');
}
function plural(k){ return k === 'mafia' ? 'Mafia' : ROLES[k].name + 's'; }
function checkWin(alive, roles){
  const ids = Object.keys(alive).filter(i => alive[i]);
  const maf = ids.filter(i => isMaf(roles[i])).length;
  if (maf === 0) return 'town';
  if (maf >= ids.length - maf) return 'mafia';
  return '';
}

const playersCol = () => S.db.collection('rooms/' + S.code + '/players');

const isBot = (r,id) => { const p = (r.roster||[]).find(x => x.id === id); return !!(p && p.bot); };
const key = r => r.gid + ':' + r.n;
function nameOf(id){
  const r = S.room; const p = r && r.roster && r.roster.find(x => x.id === id);
  if (p) return p.name;
  return (S.players[id] && S.players[id].name) || 'Someone';
}

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 5000);
}
function fail(e){
  console.error(e);
  const c = e && e.code;
  if (c === 'permission-denied'){ toast('The game server refused that. Its access rules need a look.'); return; }
  if (c === 'unavailable' || c === 'deadline-exceeded'){ toast('Lost the connection to the game server. Check your internet.'); return; }
  if (c === 'resource-exhausted'){ toast('The game server hit its free daily limit. Try again tomorrow.'); return; }
  if (c === 'not-found'){ toast('That room or player is gone. Rejoin with the code.'); return; }
  if (c === 'invalid_argument') toast('This account can watch but can\'t play. The room owner needs to invite you with edit access.');
  else if (c === 'quota_exceeded') toast('The game\'s storage is full. Ask the owner to clear old rooms.');
  else if (c === 'resource_exhausted') toast('Too many moves at once. Wait a few seconds and try again.');
  else toast('That didn\'t go through. Try again.');
}

/* ---------- Rooms ---------- */
const defaults = () => ({night:45, day:90, vote:30, reveal:true, tie:'none', mode:'auto', counts:defaultCounts()});
const STALE = 6 * 3600 * 1000;
const lastTouch = d => (d && (d.touched || d.created)) || 0;
/* Delete a room and everything under it. The room doc goes first so every open
   screen sees "That room closed" right away, then players and chat are cleared. */
async function deleteRoomData(code){
  try { await S.db.doc('rooms/' + code).delete(); } catch(e){ console.error(e); }
  for (const sub of ['players','chat']){
    try {
      const q = await S.db.collection('rooms/' + code + '/' + sub).get();
      for (const d of q.docs){ try { await S.db.doc('rooms/' + code + '/' + sub + '/' + d.id).delete(); } catch(e){} }
    } catch(e){ console.error(e); }
  }
}
/* Clear out rooms nobody has touched in a while */
async function sweepOldRooms(){
  try {
    const q = await S.db.collection('rooms').get();
    const old = q.docs.filter(d => Date.now() - lastTouch(d.data()) > STALE).map(d => d.id);
    for (const code of old.slice(0, 20)) await deleteRoomData(code);
  } catch(e){ console.error(e); }
}
async function createRoom(){
  let code = '';
  for (let tries=0; tries<8; tries++){
    code = ''; for (let i=0;i<4;i++) code += rnd('ABCDEFGHJKLMNPQRSTUVWXYZ'.split(''));
    const snap = await S.db.doc('rooms/' + code).get();
    if (!snap.exists) break;
    if (Date.now() - lastTouch(snap.data()) > STALE){ await deleteRoomData(code); break; }
  }
  await S.db.doc('rooms/' + code).set({host:S.pid, gid:newId(6), created:Date.now(), touched:Date.now(), phase:'lobby', seq:1, dur:0, ends:0, settings:defaults()});
  await joinRoom(code);
  sweepOldRooms();
}
async function joinRoom(code, silent){
  const snap = await S.db.doc('rooms/' + code).get();
  if (!snap.exists) throw {user:'No room with that code. Check the letters.'};
  const r = snap.data();
  const mine = r.roster && r.roster.some(p => p.id === S.pid);
  if (r.phase !== 'lobby' && !mine) throw {user:'That game already started. Wait for the next round.'};
  const pref = S.db.doc('rooms/' + code + '/players/' + S.pid);
  const ps = await pref.get();
  if (ps.exists) await pref.update({name:S.name});
  else {
    if (r.phase === 'lobby'){
      const all = await S.db.collection('rooms/' + code + '/players').get();
      if (all.size >= MAX) throw {user:'That room is full.'};
    }
    await pref.set({name:S.name, joined:Date.now(), bot:false});
  }
  S.db.doc('rooms/' + code).update({touched:Date.now()}).catch(() => {});
  enter(code);
}
function enter(code){
  S.code = code; LS.set('ms_code', code);
  S.room = null; S.players = {}; S.chat = {}; S.myMsgs = null; S.lastSeq = null; S.seenSelf = false; S.chan = 'town';
  S.unsub.push(roomRef().onSnapshot(snap => {
    if (!snap.exists){ leaveLocal('That room closed.'); return; }
    const r = snap.data(); S.room = r;
    if (S.pend){ const c = (r.settings && r.settings.counts) || {}; for (const k in S.pend) if (c[k] === S.pend[k]) delete S.pend[k]; }
    if (r.seq !== S.lastSeq){
      const full = (r.dur||0)*1000; let left = full;
      if (S.lastSeq === null && r.ends){ left = Math.max(0, Math.min(full, r.ends - Date.now())); }
      S.localEnd = Date.now() + left; S.lastSeq = r.seq; S.overdue = false;
    }
    render();
  }, fail));
  S.unsub.push(playersCol().onSnapshot(q => {
    const m = {}; q.docs.forEach(d => { m[d.id] = d.data(); }); S.players = m;
    if (m[S.pid]) S.seenSelf = true;
    else if (S.seenSelf && S.room && S.room.phase === 'lobby'){ leaveLocal('You were removed from the room.'); return; }
    render();
  }, fail));
  S.unsub.push(chatCol().onSnapshot(q => {
    const m = {}; q.docs.forEach(d => { m[d.id] = d.data(); }); S.chat = m;
    if (S.myMsgs === null) S.myMsgs = ((m[S.pid] && m[S.pid].m) || []).slice();
    updateChat();
  }, fail));
  render();
}
function leaveLocal(msg){
  S.unsub.forEach(u => { try { u(); } catch(e){} }); S.unsub = [];
  S.code = null; S.room = null; S.players = {}; LS.del('ms_code');
  setHomeMsg(msg || ''); render();
}
async function leaveRoom(){
  const r = S.room; if (!r) return leaveLocal();
  const code = S.code;
  try {
    if (r.phase === 'lobby' || r.phase === 'end'){
      const others = Object.keys(S.players).filter(i => i !== S.pid && !S.players[i].bot);
      if (!others.length){ leaveLocal(); await deleteRoomData(code); return; }
      if (r.host === S.pid) await roomRef().update({host:others[0]});
      S.seenSelf = false;
      await playersCol().doc(S.pid).delete();
    }
  } catch(e){ console.error(e); }
  leaveLocal();
}
async function closeRoom(){
  const code = S.code; if (!code) return;
  leaveLocal('You closed the room. Its data was cleared.');
  await deleteRoomData(code);
}

/* ---------- Host engine ---------- */
async function push(patch){
  if (busy) return; busy = true;
  try { await roomRef().update(patch); } catch(e){ pendingSeq = 0; fail(e); } finally { busy = false; }
}
function phasePatch(phase, dur, extra){
  pendingSeq = (S.room.seq||0)+1;
  return Object.assign({phase, dur, seq:pendingSeq, ends:Date.now()+dur*1000, touched:Date.now()}, extra||{});
}
async function startGame(){
  const r = S.room; if (busy) return;
  const list = Object.entries(S.players).sort((a,b) => (a[1].joined||0)-(b[1].joined||0)).map(([id,p]) => ({id, name:p.name, bot:!!p.bot}));
  if (list.length < MIN || list.length > MAX) return;
  const st = Object.assign(defaults(), r.settings||{});
  if (st.mode === 'custom' && setupProblem(list.length, st.counts)) return;
  const deal = buildRoles(list.length, st); const roles = {}, alive = {};
  list.forEach((p,i) => { roles[p.id] = deal[i]; alive[p.id] = true; });
  busy = true;
  try {
    await roomRef().set({host:r.host, gid:newId(6), created:r.created||Date.now(), settings:r.settings||defaults(),
      phase:'countdown', seq:(r.seq||0)+1, dur:5, ends:Date.now()+5000, n:1,
      touched:Date.now(), setup:countRoles(deal),
      roster:list, roles, alive, dead:{}, lastProt:{}, priv:{}, log:[], winner:'', jester:[],
      scene:{kind:'', place:'', headline:'', anchor:'', lines:[], ballots:[]}});
  } catch(e){ fail(e); } finally { busy = false; }
}
async function playAgain(){
  const r = S.room; if (busy) return; busy = true;
  try {
    await roomRef().set({host:r.host, gid:newId(6), created:r.created||Date.now(), touched:Date.now(), phase:'lobby', seq:(r.seq||0)+1, dur:0, ends:0, settings:r.settings||defaults()});
  } catch(e){ fail(e); } finally { busy = false; }
  /* Last game's chat is no longer needed */
  try {
    const q = await chatCol().get();
    for (const d of q.docs) await chatCol().doc(d.id).delete();
  } catch(e){ console.error(e); }
}
function humanPick(r, id, field, cands){
  const p = S.players[id]; const a = p && p[field];
  if (!a || a.k !== key(r)) return null;
  return cands.includes(a.t) ? a.t : null;
}
function nightDone(r){
  return aliveIds(r).every(i => {
    if (isBot(r,i) || ['citizen','jester'].includes(r.roles[i])) return true;
    const p = S.players[i]; return !!(p && p.act && p.act.k === key(r));
  });
}
function voteDone(r){
  return aliveIds(r).every(i => isBot(r,i) || (S.players[i] && S.players[i].vote && S.players[i].vote.k === key(r)));
}
function skipDone(r){
  const hs = aliveIds(r).filter(i => !isBot(r,i));
  const yes = hs.filter(i => S.players[i] && S.players[i].skip === key(r)).length;
  return hs.length > 0 && yes * 2 > hs.length;
}
async function resolveNight(){
  const r = S.room, alive = aliveIds(r), roles = r.roles;
  const crew = alive.filter(i => isMaf(roles[i])), marks = alive.filter(i => !isMaf(roles[i]));
  const tally = {}; let gf = null, any = false;
  crew.forEach(i => {
    if (isBot(r,i)) return;
    const t = humanPick(r, i, 'act', marks);
    if (t){ tally[t] = (tally[t]||0)+1; any = true; if (roles[i] === 'godfather') gf = t; }
  });
  let target = null;
  if (any){
    const max = Math.max(...Object.values(tally)); const top = Object.keys(tally).filter(t => tally[t] === max);
    target = top.length === 1 ? top[0] : (gf && top.includes(gf) ? gf : rnd(top));
  } else if (crew.some(i => isBot(r,i)) && marks.length) target = rnd(marks);

  const docs = alive.filter(i => roles[i] === 'doctor'); const prots = {};
  docs.forEach(d => {
    const c = alive.filter(i => i !== (r.lastProt||{})[d]);
    prots[d] = (isBot(r,d) ? rnd(c) : humanPick(r, d, 'act', c)) || '';
  });
  const saved = !!target && Object.values(prots).includes(target);
  const killed = target && !saved ? target : null;

  const priv = {};
  const note = (id, line) => { priv[id] = ((r.priv||{})[id] || []).concat([`Night ${r.n}: ${line}`]); };
  alive.forEach(i => {
    if (isBot(r,i)) return;
    const others = alive.filter(j => j !== i);
    if (roles[i] === 'detective'){
      const t = humanPick(r, i, 'act', others);
      if (t) note(i, `You tailed ${nameOf(t)}. Their role: ${roles[t] === 'godfather' ? 'Citizen' : ROLES[roles[t]].name}.`);
    } else if (roles[i] === 'sheriff'){
      const t = humanPick(r, i, 'act', others);
      if (t) note(i, `You checked ${nameOf(t)}. They seem ${(roles[t] === 'mafia' || roles[t] === 'jester') ? 'suspicious' : 'fine'}.`);
    } else if (roles[i] === 'doctor' && prots[i]){
      const pr = prots[i];
      note(i, pr === target ? `You protected ${nameOf(pr)} and scared off the Mafia.` : `You protected ${nameOf(pr)}. Nobody came for them.`);
    }
  });

  const newAlive = {}, dead = {}; const log = (r.log||[]).slice(); const lines = [];
  const place = rnd(PLACES); let headline;
  if (killed){
    newAlive[killed] = false; dead[killed] = {n:r.n, by:'night'};
    headline = rnd(H_KILL);
    lines.push(fill(rnd(S_KILL), nameOf(killed), place), `${nameOf(killed)} is out of the game.`);
    if (r.settings.reveal) lines.push(`They were the ${ROLES[roles[killed]].name}.`);
    log.push(`Night ${r.n}: The Mafia eliminated ${nameOf(killed)} (${ROLES[roles[killed]].name}).`);
  } else if (saved){
    headline = rnd(H_SAVE);
    lines.push(fill(rnd(S_SAVE), '', place), 'Nobody was eliminated.');
    log.push(`Night ${r.n}: The Mafia went after ${nameOf(target)}. The Doctor saved them.`);
  } else {

async function resolveVote(){
  const r = S.room, alive = aliveIds(r), roles = r.roles;
  const tally = {}, ballots = [];
  alive.forEach(i => {
    let t = null;
    if (isBot(r,i)){
      const c = alive.filter(j => j !== i && !(isMaf(roles[i]) && isMaf(roles[j])));
      t = (Math.random() < 0.15 || !c.length) ? 'skip' : rnd(c);
    } else t = humanPick(r, i, 'vote', alive.concat(['skip']));
    if (t){ tally[t] = (tally[t]||0)+1; ballots.push({v:i, t:t}); }
  });
  let out = null;
  const counts = Object.values(tally);
  if (counts.length){
    const max = Math.max(...counts); const top = Object.keys(tally).filter(t => tally[t] === max);
    if (top.length === 1) out = top[0] === 'skip' ? null : top[0];
    else if (r.settings.tie === 'random'){ const c = top.filter(t => t !== 'skip'); out = c.length ? rnd(c) : null; }
  }
  const newAlive = {}, dead = {}; const log = (r.log||[]).slice(); const lines = []; let jester = (r.jester||[]).slice();
  const place = rnd(PLACES); let headline;
  if (out){
    newAlive[out] = false; dead[out] = {n:r.n, by:'vote'};
    if (roles[out] === 'jester'){
      jester.push(out);
      headline = rnd(H_JESTER);
      lines.push(fill(rnd(S_JESTER), nameOf(out), place));
      log.push(`Day ${r.n}: The town voted out ${nameOf(out)}, the Jester. The Jester wins.`);
    } else {
      headline = rnd(H_OUT);
      lines.push(fill(rnd(S_OUT), nameOf(out), place), `${nameOf(out)} is out of the game.`);
      if (r.settings.reveal) lines.push(`They were the ${ROLES[roles[out]].name}.`);
      log.push(`Day ${r.n}: The town voted out ${nameOf(out)} (${ROLES[roles[out]].name}).`);
    }
  } else {
    headline = rnd(H_NONE);
    lines.push(fill(rnd(S_NONE), '', place));
    log.push(`Day ${r.n}: The town voted out nobody.`);
  }
  const winner = checkWin(Object.assign({}, r.alive, newAlive), roles);
  await push(phasePatch('verdict', 10, {alive:newAlive, dead, log, winner, jester,
    scene:{kind:'verdict', place, headline, anchor:rnd(ANCHORS), lines, ballots}}));
}
function hostTick(){
  const r = S.room; if (!r || busy || r.host !== S.pid || !S.db) return;
  if (pendingSeq && (r.seq||0) < pendingSeq) return;
  const left = S.localEnd - Date.now(), gone = (r.dur||0)*1000 - left;
  const st = r.settings || defaults();
  switch (r.phase){
    case 'countdown': if (left <= 0) push(phasePatch('roles', 12)); break;
    case 'roles': if (left <= 0) push(phasePatch('night', st.night)); break;
    case 'night': if (left <= 0 || (gone > 10000 && nightDone(r))) resolveNight(); break;
    case 'dawn': if (left <= 0) push(r.winner ? phasePatch('end', 0) : phasePatch('day', st.day)); break;
    case 'day': if (left <= 0 || (gone > 5000 && skipDone(r))) push(phasePatch('vote', st.vote)); break;
    case 'vote': if (left <= 0 || (gone > 5000 && voteDone(r))) resolveVote(); break;
    case 'verdict': if (left <= 0) push(r.winner ? phasePatch('end', 0) : phasePatch('night', st.night, {n:r.n+1})); break;
  }
}

  const r = S.room, alive = aliveIds(r), k = key(r);
  setSky('Day ' + r.n, 'Talk it out. Who is acting strange?');
  const hs = alive.filter(i => !isBot(r,i)); const yes = hs.filter(i => S.players[i] && S.players[i].skip === k).length;
  const meYes = S.players[S.pid] && S.players[S.pid].skip === k;
  return [takeoverBox(),
    sceneTv(r.scene, true),
    h('div',{class:'panel'},
      h('h2',null,'Discuss in the Town chat'),
      h('p',null,'Share what you know. Or what you want people to think you know. Voting starts when the timer runs out.'),
      iAmAlive() ? h('div',{class:'row'},
        h('button',{class:'btn',disabled:!!meYes,onclick:() => mine({skip:k})}, meYes ? 'You\'re ready to vote' : 'I\'m ready to vote'),
        h('span',{class:'muted'}, `${yes} of ${hs.length} ready. More than half skips ahead.`)) : h('p',{class:'muted'},'Ghosts can watch but can\'t talk to the living.')),
    h('div',{class:'panel'}, roleBox(), notesBox() ? h('div',{style:'margin-top:12px'}, notesBox()) : null),
    rosterBox()];
}
function viewVote(){
  const r = S.room, alive = aliveIds(r), k = key(r), mineP = S.players[S.pid] || {};
  setSky('The vote', 'Point a finger. Choose carefully.');
  const cur = mineP.vote && mineP.vote.k === k ? mineP.vote.t : null;
  const hs = alive.filter(i => !isBot(r,i)); const inN = hs.filter(i => S.players[i] && S.players[i].vote && S.players[i].vote.k === k).length;
  return [takeoverBox(),
    tv({compact:true, kind:'vote', headline:'Breaking: the town is voting', anchor:pickBy(ANCHORS, r.gid + 'vote' + r.n) + ', live from Town Hall',
      lines:[`${inN} of ${hs.length} votes are in. Results right after the timer.`]}),
    h('div',{class:'panel'},
      iAmAlive() ? [h('h2',null,'Who should leave town?'),
        picker(alive.filter(i => i !== S.pid), cur, setVote, 'Skip the vote'),
        h('p',{class:'muted'}, cur ? 'Vote locked in. You can change it until time runs out.' : 'Votes stay hidden until the verdict.')]
        : h('p',null,'Ghosts don\'t get a vote.'),
      h('p',{class:'muted',style:'margin:0'}, `${inN} of ${hs.length} votes in.`)),
    h('div',{class:'panel'}, roleBox(), notesBox() ? h('div',{style:'margin-top:12px'}, notesBox()) : null),
    rosterBox()];
}
function viewEnd(){
  const r = S.room, k = myRole(), host = r.host === S.pid;
  const townWon = r.winner === 'town';
  setSky(townWon ? 'The Town wins' : 'The Mafia wins', townWon ? 'The streets are safe again.' : 'The town belongs to the crew now.');
  const jest = (r.jester||[]).map(nameOf);
  let me = '';
  if (k){
    const won = k === 'jester' ? (r.jester||[]).includes(S.pid) : ((ROLES[k].team === 'town') === townWon);
    me = won ? 'You won this one.' : 'Not your night. Next time.';
  }
  const jl = r.jester && r.jester.length;
  return [
    tv({kind:'end', headline: townWon ? 'The Town wins!' : 'The Mafia takes over',
      anchor:pickBy(ANCHORS, r.gid + 'end') + ', special report',
      lines:[townWon ? 'Every last member of the Mafia has been run out of town. Neighbors are celebrating with a block party.'
        : 'The Mafia now runs the town. Expect fancy hats, slow music, and very expensive cannoli.',
        ...(jl ? ['Also, a Jester got exactly what they wanted.'] : [])]}),
    h('div',{class:'panel'},
      h('h2',null, me || 'Game over'),
      jest.length ? h('p',null, `${jest.join(' and ')} also won as the Jester by getting voted out.`) : null,
      host ? h('button',{class:'btn gold',onclick:playAgain}, 'Play again') : h('p',{class:'muted',style:'margin:0'}, 'Waiting for the host to start a new game.'),
      takeoverBox()),
    rosterBox(true),
    h('div',{class:'panel'}, h('h2',null,'How it happened'), h('ol',{class:'timeline'}, (r.log||[]).map(l => h('li',null,l)))),
    h('div',{class:'row'}, h('button',{class:'btn quiet',onclick:leaveRoom}, 'Leave room'),
      host ? h('button',{class:'btn quiet',onclick:closeRoom}, 'Close room for everyone') : null)];
}

function render(){
  const home = $('home'), stage = $('stage'), chat = $('chat'), wrap = $('wrap');
  if (!S.code || !S.room){
    document.body.dataset.phase = 'home'; updateChip(null);
    home.hidden = false; stage.hidden = true; chat.hidden = true; wrap.className = '';
    setSky('Mafia: Shadows', 'Somebody in this town is lying.');
    $('createBtn').disabled = $('joinBtn').disabled = !S.db;
    if (S.ready && !S.db) setHomeMsg(FIREBASE_CONFIG.projectId
      ? 'The game can\'t reach its server. Check your connection and reload.'
      : 'This copy isn\'t connected to a game server yet, so rooms are turned off.');
    return;
  }
  const r = S.room; document.body.dataset.phase = r.phase === 'roles' || r.phase === 'countdown' || r.phase === 'lobby' ? 'night' : r.phase;
  updateChip(r);
  home.hidden = true; stage.hidden = false;
  const noChat = r.phase === 'countdown' || r.phase === 'roles';
  chat.hidden = noChat; wrap.className = noChat ? '' : 'withchat';
  let v;
  switch (r.phase){
    case 'lobby': v = viewLobby(); break;
    case 'countdown': v = viewCountdown(); break;
    case 'roles': v = viewRoles(); break;
    case 'night': v = viewNight(); break;
    case 'dawn': case 'verdict': v = viewScene(); break;
    case 'day': v = viewDay(); break;
    case 'vote': v = viewVote(); break;
    case 'end': v = viewEnd(); break;
    default: v = h('p',null,'Loading...');
  }
  const openRole = stage.querySelector('details.myrole'); const wasOpen = openRole && openRole.open;
  stage.replaceChildren(...[].concat(v).flat(3).filter(Boolean));
  if (wasOpen){ const d = stage.querySelector('details.myrole'); if (d) d.open = true; }
  updateChat();
}

let chipLast = null;
function updateChip(r){
  const chip = $('mafiaChip');
  if (!r || !r.roster || ['lobby','countdown'].includes(r.phase)){ chip.hidden = true; chipLast = null; return; }
  const left = mafiaLeft(r), total = mafiaTotal(r);
  chip.hidden = false;
  chip.replaceChildren(h('span',{class:'num'}, String(left)), diamonds(left, total),
    h('span',{class:'lbl'}, left === 1 ? 'Mafia left' : 'Mafia left', h('span',null, `of ${total} at the start`)));
  if (chipLast !== null && left < chipLast){ chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); }
  chipLast = left;
}

/* ---------- Chat ---------- */
let chatSig = '', chatQ = Promise.resolve();
function channels(){
  const r = S.room; const ch = [['town','Town']];
  if (inGame(r) && isMaf(myRole())) ch.push(['mafia','Crew']);
  if (inGame(r) && myRole() && !iAmAlive()) ch.push(['dead','Ghosts']);
  return ch;
}
function postRule(ch){
  const r = S.room; if (!r) return 'Not in a room.';
  if (ch === 'mafia') return iAmAlive() || r.phase === 'end' ? '' : 'Ghosts can\'t talk to the crew.';
  if (ch === 'dead') return '';
  if (r.phase === 'lobby' || r.phase === 'end') return '';
  if (!myRole()) return 'You\'re watching this round.';
  if (!iAmAlive()) return 'Ghosts can\'t talk to the living.';
  if (r.phase === 'night') return 'The town is asleep. Chat opens in the morning.';
  return '';
}
function buildChat(){
  const input = h('input',{id:'chatIn',maxlength:'240',autocomplete:'off','aria-label':'Message',onkeydown:e => { if (e.key === 'Enter') sendChat(); }});
  $('chat').append(h('div',{class:'tabs',role:'tablist',id:'tabs'}), h('div',{id:'msgs','aria-live':'polite'}),
    h('div',{class:'chatin'}, input, h('button',{class:'btn gold',id:'sendBtn',onclick:sendChat}, 'Send')));
}
function updateChat(){
  const r = S.room; if (!r) return;
  const chs = channels(); if (!chs.some(c => c[0] === S.chan)) S.chan = 'town';
  $('tabs').replaceChildren(...chs.map(([id,label]) => h('button',{role:'tab','aria-selected':String(S.chan === id),onclick:() => { S.chan = id; chatSig = ''; updateChat(); }}, label)));
  const all = [];
  Object.keys(S.chat).forEach(id => {
    const list = id === S.pid && S.myMsgs ? S.myMsgs : (S.chat[id].m || []);
    list.forEach(m => { if (m.g === r.gid && m.c === S.chan) all.push({id, t:m.t, x:m.x}); });
  });
  if (S.myMsgs && !S.chat[S.pid]) S.myMsgs.forEach(m => { if (m.g === r.gid && m.c === S.chan) all.push({id:S.pid, t:m.t, x:m.x}); });
  all.sort((a,b) => a.t - b.t);
  const sig = S.chan + '|' + all.length + '|' + (all.length ? all[all.length-1].t : 0);
  if (sig !== chatSig){
    chatSig = sig; const box = $('msgs');
    box.replaceChildren(...(all.length ? all.map(m => h('div',{class:'m' + (m.id === S.pid ? ' me' : '')}, h('b',null, nameOf(m.id)), m.x))
      : [h('p',{class:'muted'}, S.chan === 'mafia' ? 'Only your crew can read this.' : S.chan === 'dead' ? 'Only ghosts can read this.' : 'Nobody has said anything yet.')]));
    box.scrollTop = box.scrollHeight;
  }
  const rule = postRule(S.chan); const input = $('chatIn');
  input.disabled = !!rule; $('sendBtn').disabled = !!rule;
  input.placeholder = rule || (S.chan === 'mafia' ? 'Whisper to your crew' : S.chan === 'dead' ? 'Say something spooky' : 'Say something to the town');
}
function sendChat(){
  const input = $('chatIn'); const x = input.value.trim().slice(0,240);
  if (!x || postRule(S.chan) || !S.room) return;
  input.value = '';
  S.myMsgs = (S.myMsgs || []).filter(m => m.g === S.room.gid).slice(-39).concat([{t:Date.now(), c:S.chan, x, g:S.room.gid}]);
  const copy = S.myMsgs.slice(); const ref = chatCol().doc(S.pid);
  chatQ = chatQ.then(() => ref.set({m:copy})).catch(fail);
  updateChat();
}

/* ---------- Clock ---------- */
function tick(){
  const r = S.room; const clock = $('clock'), orb = $('orb');
  if (!r || !r.dur){ clock.textContent = ''; orb.style.left = '82%'; orb.style.bottom = '68%'; return; }
  const left = Math.max(0, S.localEnd - Date.now()); const p = 1 - left / (r.dur*1000);
  orb.style.left = (8 + 84*p) + '%'; orb.style.bottom = (36 + 40*Math.sin(Math.PI*p)) + '%';
  const s = Math.ceil(left/1000); clock.textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  const od = Date.now() > S.localEnd + 15000;
  if (od !== S.overdue){ S.overdue = od; render(); }
  hostTick();
}

/* ---------- Storage ---------- */
function loadScript(src){
  return new Promise((ok, no) => { const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = () => no(new Error('Could not load ' + src)); document.head.append(el); });
}
/* Firestore replaces a whole nested map on update. Dotted paths change only the keys named,
   which is what the game expects: {alive:{p1:false}} becomes {'alive.p1': false}. */
function flatten(obj, pre, out){
  out = out || {};
  for (const k in obj){
    const v = obj[k], path = pre ? pre + '.' + k : k;
    if (v === undefined) continue;
    if (v && typeof v === 'object' && !Array.isArray(v)) flatten(v, path, out);
    else out[path] = v;
  }
  return out;
}
function fireDb(fs){
  const wrapDoc = ref => ({
    get: () => ref.get(),
    set: d => ref.set(d),
    update: d => { const f = flatten(d); return Object.keys(f).length ? ref.update(f) : Promise.resolve(); },
    delete: () => ref.delete(),
    onSnapshot: (next, err) => ref.onSnapshot(next, err)
  });
  const wrapCol = ref => ({
    get: () => ref.get(),
    doc: id => wrapDoc(ref.doc(id)),
    onSnapshot: (next, err) => ref.onSnapshot(next, err)
  });
  return { doc: p => wrapDoc(fs.doc(p)), collection: p => wrapCol(fs.collection(p)) };
}
async function connect(){
  if (FIREBASE_CONFIG.projectId){
    try {
      if (!window.firebase){
        const base = 'https://www.gstatic.com/firebasejs/' + FIREBASE_VERSION + '/';
        await loadScript(base + 'firebase-app-compat.js');
        await loadScript(base + 'firebase-firestore-compat.js');
      }
      const app = window.firebase.apps.length ? window.firebase.app() : window.firebase.initializeApp(FIREBASE_CONFIG);
      const fs = app.firestore();
      try { fs.settings({ignoreUndefinedProperties:true, merge:true}); } catch(e){}
      S.server = 'firebase';
      return fireDb(fs);
    } catch(e){ console.error(e); }
  }
  try {
    const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (db) S.server = 'claude';
    return db;
  } catch(e){ return null; }
}

/* ---------- Boot ---------- */
async function init(){
  buildHome(); buildChat(); render(); setInterval(tick, 500);
  const db = await connect();
  S.db = db; S.ready = true; render();
  let linked = '';
  try { linked = (new URLSearchParams(location.search).get('room') || '').toUpperCase(); } catch(e){}
  if (!/^[A-Z]{4}$/.test(linked)) linked = '';
  const clearLink = () => { try { history.replaceState(null, '', location.pathname); } catch(e){} };
  if (linked){
    $('codeIn').value = linked;
    if (db && S.name){
      try { await joinRoom(linked); clearLink(); } catch(e){ clearLink(); setHomeMsg((e && e.user) || 'Could not join that room.'); }
    } else {
      setHomeMsg(`You're joining room ${linked}. Type your name, then tap Join room.`);
      $('nameIn').focus();
    }
    return;
  }
  const last = LS.get('ms_code');
  if (db && last && S.name){
    try { await joinRoom(last, true); } catch(e){ LS.del('ms_code'); }
  }
}
init();
})();
</script>
